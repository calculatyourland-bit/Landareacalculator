<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ब्लॉग एडमिन पैनल</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
        .admin-wrapper { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .login-container { max-width: 400px; margin: 100px auto; }
        .password-hint { font-size: 12px; color: #666; margin-top: 5px; }
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: rgba(255,255,255,0.7); border: none; border-radius: 30px; cursor: pointer; }
        .tab-btn.active { background: var(--primary-gradient); color: white; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .existing-posts { margin-top: 30px; }
        .post-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.5); border-radius: 16px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="glass-box admin-wrapper">
            <div class="admin-header">
                <h1>📝 ब्लॉग एडमिन पैनल</h1>
                <button class="admin-btn" id="logoutBtn" style="display:none;">लॉगआउट</button>
            </div>

            <div id="loginSection">
                <div class="admin-login">
                    <h2>🔐 पासवर्ड डालें</h2>
                    <input type="password" id="adminPassword" placeholder="पासवर्ड">
                    <button class="admin-btn" id="loginBtn">लॉगिन</button>
                    <p class="password-hint">Hint: admin123 (सिर्फ डेमो के लिए)</p>
                </div>
            </div>

            <div id="adminPanel" style="display:none;">
                <div class="admin-tabs">
                    <button class="tab-btn active" data-tab="new">➕ नया पोस्ट</button>
                    <button class="tab-btn" data-tab="list">📋 सभी पोस्ट</button>
                    <button class="tab-btn" data-tab="export">📤 एक्सपोर्ट</button>
                </div>

                <div class="tab-pane active" id="tab-new">
                    <form id="postForm" class="admin-form">
                        <div class="form-group">
                            <label>शीर्षक (Title)</label>
                            <input type="text" id="postTitle" required>
                        </div>
                        <div class="form-group">
                            <label>स्लग (Slug) - अपने आप बनेगा</label>
                            <input type="text" id="postSlug" readonly>
                        </div>
                        <div class="form-group">
                            <label>विवरण (Description)</label>
                            <textarea id="postDescription" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>इमेज URL</label>
                            <input type="url" id="postImage" required>
                        </div>
                        <div class="form-group">
                            <label>श्रेणी (Category)</label>
                            <select id="postCategory">
                                <option>भूमि माप</option>
                                <option>सरकारी योजना</option>
                                <option>खेती की सलाह</option>
                                <option>भूमि कानून</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>टैग (अल्पविराम से अलग करें)</label>
                            <input type="text" id="postTags" placeholder="बीघा, कट्ठा, धुर">
                        </div>
                        <div class="form-group">
                            <label>पढ़ने का समय (मिनट में)</label>
                            <input type="number" id="postReadTime" value="3">
                        </div>
                        <div class="form-group">
                            <label>पोस्ट कंटेंट (HTML)</label>
                            <textarea id="postContent" rows="10" required></textarea>
                        </div>
                        <button type="submit" class="admin-btn">जनरेट JSON</button>
                    </form>

                    <div class="admin-preview" id="livePreview"></div>
                    
                    <div id="jsonOutput" class="json-output" style="display:none;"></div>
                    <button id="copyJsonBtn" class="admin-btn" style="margin-top:10px; display:none;">कॉपी करें</button>
                    <button id="downloadJsonBtn" class="admin-btn" style="margin-top:10px; display:none;">JSON डाउनलोड करें</button>
                </div>

                <div class="tab-pane" id="tab-list">
                    <div class="existing-posts" id="postsList"></div>
                </div>

                <div class="tab-pane" id="tab-export">
                    <h3>📥 पूरा JSON डाउनलोड करें</h3>
                    <button class="admin-btn" id="exportAllBtn">posts.json डाउनलोड करें</button>
                    
                    <h3 style="margin-top:30px;">⚙️ GitHub अपडेट (Advanced)</h3>
                    <p>GitHub Pages पर सीधे अपडेट करने के लिए:</p>
                    <ol>
                        <li>इस JSON को कॉपी करें</li>
                        <li>GitHub repo में data/posts.json को अपडेट करें</li>
                        <li>Commit करें - 2 मिनट में साइट अपडेट हो जाएगी</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/admin.js"></script>
</body>
</html>
