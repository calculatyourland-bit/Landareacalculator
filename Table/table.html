<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2×5 टेबल – केवल टेबल (बिना बैकग्राउंड)</title>
  <!-- सिर्फ टेबल के लिए जरूरी स्टाइल, कोई बैकग्राउंड नहीं -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* बिल्कुल सिर्फ टेबल से जुड़ा हुआ CSS — बाकी सब हटा दिया गया */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #059669;
      --primary-soft: #10b981;
      --primary-dark: #047857;
      --primary-gradient: linear-gradient(145deg, #059669, #10b981);
      --text-soft: #065f46;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* टेबल का क्लास - बिल्कुल Post.html जैसा */
    .conversion-table {
      width: 100%;
      max-width: 600px;
      border-collapse: collapse;
      background: white;  /* सफेद बैकग्राउंड, कोई ग्लास इफेक्ट नहीं */
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      font-family: 'Inter', sans-serif;
      border: 1px solid #e2e8f0;  /* हल्की बॉर्डर */
    }

    .conversion-table th {
      background: var(--primary-gradient);
      color: white;
      padding: 16px 24px;
      font-weight: 600;
      font-size: 1rem;
      text-align: left;
    }

    .conversion-table td {
      padding: 14px 24px;
      border-bottom: 1px solid #e2e8f0;
      color: #1e293b;  /* गहरा स्लेट रंग */
      font-weight: 500;
      font-size: 1rem;
    }

    .conversion-table tr:last-child td {
      border-bottom: none;
    }

    .conversion-table tr:hover {
      background-color: #f1f5f9;  /* हल्का ग्रे होवर */
      transition: background-color 0.2s ease;
    }

    /* रिस्पॉन्सिव */
    @media (max-width: 480px) {
      .conversion-table th,
      .conversion-table td {
        padding: 12px 16px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<!-- बॉडी में कोई बैकग्राउंड नहीं, सिर्फ टेबल दिखेगी -->
<body style="background: transparent; padding: 20px; display: flex; justify-content: center;">
  <!-- बिल्कुल सादा 2×5 टेबल - बिना किसी एक्स्ट्रा चीज के -->
  <table class="conversion-table">
    <thead>
      <tr>
        <th>इकाई (Unit)</th>
        <th>रूपांतरण मान</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>1 एकड़ (Acre)</td><td>4046.86 वर्ग मीटर</td></tr>
      <tr><td>1 बीघा (यूपी)</td><td>2530 वर्ग मीटर</td></tr>
      <tr><td>1 हेक्टेयर</td><td>10000 वर्ग मीटर</td></tr>
      <tr><td>1 कट्ठा (पूर्वोत्तर)</td><td>720 वर्ग फुट</td></tr>
      <tr><td>1 मरला (पंजाब)</td><td>25.29 वर्ग मीटर</td></tr>
    </tbody>
  </table>
</body>
</html>
