<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>लग्गी आधारित भूमि कन्वर्टर | खेत का क्षेत्रफल</title>
  
  <meta name="description" content="हाथ की लग्गी के अनुसार बीघा, कट्ठा, धुर, धुरकी से डिसमिल,एकर, हेक्टर में तुरंत रूपांतरण।">
  <meta name="keywords" content="Land Area Calculator, Bigha Kattha Dhur, लग्गी, हाथ की लग्गी, खेत का क्षेत्रफल, भूमि माप">
  <meta name="author" content="Land Tools">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #059669;
      --primary-soft: #10b981;
      --primary-dark: #047857;
      --primary-gradient: linear-gradient(145deg, #059669, #10b981);
      --bg-light: #f0fdf4;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --text-dark: #064e3b;
      --text-soft: #065f46;
      --text-muted: #047857;
      --card-bg-1: rgba(236, 253, 245, 0.9);
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      background: linear-gradient(145deg, #d1fae5 0%, #a7f3d0 100%);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 100px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><path d="M10 50 L30 30 L50 50 L70 30 L90 50" stroke="%23059669" fill="none" stroke-width="2"/><circle cx="30" cy="70" r="3" fill="%23059669"/><circle cx="70" cy="70" r="3" fill="%23059669"/></svg>');
      background-size: 100px 100px;
      pointer-events: none;
      z-index: 0;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 12px;
      position: relative;
      z-index: 1;
    }

    .glass-box {
      width: 100%;
      max-width: 700px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 28px 26px;
      border-radius: 48px;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.6s var(--bounce);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(145deg, #059669, #10b981, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
      position: relative;
      display: inline-block;
    }

    h1::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background: var(--primary-gradient);
      border-radius: 4px;
    }

    .hero-name {
      display: inline-block;
      font-size: 15px;
      font-weight: 600;
      margin-top: 16px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      padding: 8px 24px;
      border-radius: 60px;
      color: var(--text-dark);
      border: 1px solid rgba(5, 150, 105, 0.2);
      box-shadow: var(--shadow-sm);
    }

    .ad-placeholder {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      margin: 24px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      border: 2px dashed rgba(5, 150, 105, 0.3);
      position: relative;
      overflow: hidden;
    }

    .input-section {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 24px;
      margin: 20px 0;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
      font-size: 16px;
    }

    .input-group label i {
      color: var(--primary);
      width: 20px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input,
    .input-wrapper select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(5, 150, 105, 0.2);
      border-radius: 20px;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      background: white;
      transition: all 0.3s;
    }

    /* Numeric keyboard on mobile */
    .input-wrapper input[type="number"] {
      -moz-appearance: textfield;
    }
    
    .input-wrapper input[type="number"]::-webkit-outer-spin-button,
    .input-wrapper input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .input-wrapper input:focus,
    .input-wrapper select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
    }

    .input-wrapper input:hover,
    .input-wrapper select:hover {
      border-color: var(--primary-soft);
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin: 25px 0 20px;
    }

    .btn {
      flex: 1;
      padding: 16px 20px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.3s var(--bounce);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-calculate {
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 10px 20px -8px var(--primary);
    }

    .btn-reset {
      background: white;
      color: var(--text-dark);
      border: 2px solid var(--primary);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn i {
      font-size: 18px;
    }

    .info-bar {
      background: rgba(5, 150, 105, 0.1);
      border-radius: 20px;
      padding: 16px;
      margin: 24px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid var(--primary);
    }

    .info-bar i {
      color: var(--primary);
      font-size: 20px;
    }

    .info-bar span {
      color: var(--text-dark);
      font-size: 15px;
      font-weight: 500;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 24px;
    }

    .result-card {
      background: white;
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s var(--bounce);
      border: 1px solid rgba(5, 150, 105, 0.1);
    }

    .result-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .result-card.full-width {
      grid-column: span 2;
      background: linear-gradient(145deg, white, #f0fdf4);
    }

    .result-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-soft);
      font-size: 14px;
      margin-bottom: 10px;
    }

    .result-label i {
      color: var(--primary);
    }

    .result-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.2;
    }

    .result-unit {
      font-size: 13px;
      color: var(--text-muted);
      margin-left: 5px;
    }

    .highlight {
      color: var(--primary);
      font-size: 14px;
      margin-top: 5px;
    }
    
  </style>

   <!-- ads by goolge-->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6241650069864044"
     crossorigin="anonymous"></script>
  
</head>
<body>

<div class="main-content">
  <header class="glass-box">
    <div class="top">
      <h1>🌾 लग्गी आधारित भूमि कन्वर्टर</h1>
      <div class="hero-name">
        <span>📐 हाथ की लग्गी से खेत नापें</span>
      </div>
    </div>

    <!-- Ad Space -->
    <div class="ad-placeholder">
      <span>विज्ञापन स्थान (Ad Space)</span>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <div class="input-group">
        <label><i class="fas fa-arrows-alt"></i> बीघा (Bigha)</label>
        <div class="input-wrapper">
          <input type="number" id="bigha" placeholder="0" step="0.01" inputmode="numeric" pattern="[0-9]*">
        </div>
      </div>

      <div class="input-group">
        <label><i class="fas fa-arrows-alt-h"></i> कट्ठा (Kattha)</label>
        <div class="input-wrapper">
          <input type="number" id="kattha" placeholder="0" step="0.01" inputmode="numeric" pattern="[0-9]*">
        </div>
      </div>

      <div class="input-group">
        <label><i class="fas fa-square"></i> धुर (Dhur)</label>
        <div class="input-wrapper">
          <input type="number" id="dhur" placeholder="0" step="0.01" inputmode="numeric" pattern="[0-9]*">
        </div>
      </div>

      <div class="input-group">
        <label><i class="fas fa-minus"></i> धुरकी (Dhurki)</label>
        <div class="input-wrapper">
          <input type="number" id="dhurki" placeholder="0" step="0.01" inputmode="numeric" pattern="[0-9]*">
        </div>
      </div>

      <div class="input-group">
        <label><i class="fas fa-ruler"></i> हाथ की लग्गी (Haath Ki Laggi) - 4 to 13 haath</label>
        <div class="input-wrapper">
          <select id="laggi"></select>
        </div>
      </div>

      <!-- Calculate and Reset Buttons -->
      <div class="button-group">
        <button class="btn btn-calculate" onclick="calculate()">
          <i class="fas fa-calculator"></i> गणना करें (Calculate)
        </button>
        <button class="btn btn-reset" onclick="resetForm()">
          <i class="fas fa-undo-alt"></i> रीसेट करें (Reset)
        </button>
      </div>

      <!-- Info Bar -->
      <div class="info-bar">
        <i class="fas fa-info-circle"></i>
        <span>1 Bigha = 20 Kattha = 400 Dhur = 8000 Dhurki</span>
      </div>

      <!-- Results Cards -->
      <div class="results-grid" id="output">
        <!-- Populated by JavaScript -->
      </div>
    </div>

    <!-- Footer in English -->
    <footer>
     <div id="footer-container"></div>
    </footer>
  </header>
</div>

<script>
  // Populate Laggi Dropdown (4 to 13, 0.25 interval) with 6.5 as default
  let laggiSelect = document.getElementById("laggi");
  let defaultLaggi = 6.5;
  
  for(let i=4; i<=13.0001; i+=0.25){
    let val = parseFloat(i.toFixed(2));
    let option = document.createElement("option");
    option.value = val;
    option.text = val + " हाथ";
    if (val === defaultLaggi) {
      option.selected = true;
    }
    laggiSelect.appendChild(option);
  }

  // Main Calculation Function - reads values, treats empty as 0
  function calculate(){
    let bigha = parseFloat(document.getElementById("bigha").value) || 0;
    let kattha = parseFloat(document.getElementById("kattha").value) || 0;
    let dhur = parseFloat(document.getElementById("dhur").value) || 0;
    let dhurki = parseFloat(document.getElementById("dhurki").value) || 0;
    let laggi = parseFloat(document.getElementById("laggi").value) || 6.5;

    // Conversion logic
    let totalDhur = (bigha * 400) + (kattha * 20) + dhur + (dhurki / 20);
    let totalSqft = totalDhur * Math.pow((laggi * 18 / 12), 2);
    let dismil = totalSqft / 435.6;
    let acre = totalSqft / 43560;
    let hectare = totalSqft / 107639.104;

    // Format numbers
    const formatter = new Intl.NumberFormat('hi-IN', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 4
    });

    // Update results
    document.getElementById("output").innerHTML = `
      <div class="result-card">
        <div class="result-label">
          <i class="fas fa-cubes"></i> कुल धुर (Total Dhur)
        </div>
        <div class="result-value">${formatter.format(totalDhur)}</div>
        <div class="result-unit">धुर</div>
      </div>
      
      <div class="result-card full-width">
        <div class="result-label">
          <i class="fas fa-vector-square"></i> कुल क्षेत्रफल (Total Area)
        </div>
        <div class="result-value">${formatter.format(totalSqft)} <span class="result-unit">वर्ग फुट</span></div>
        <div class="highlight">≈ ${formatter.format(totalSqft * 0.0929)} वर्ग मीटर</div>
      </div>
      
      <div class="result-card">
        <div class="result-label">
          <i class="fas fa-circle"></i> डिसमिल (Dismil)
        </div>
        <div class="result-value">${formatter.format(dismil)}</div>
      </div>
      
      <div class="result-card">
        <div class="result-label">
          <i class="fas fa-tractor"></i> एकड़ (Acre)
        </div>
        <div class="result-value">${formatter.format(acre)}</div>
      </div>
      
      <div class="result-card full-width">
        <div class="result-label">
          <i class="fas fa-globe"></i> हेक्टेयर (Hectare)
        </div>
        <div class="result-value">${formatter.format(hectare)}</div>
      </div>
    `;
  }

  // Reset Form Function
  function resetForm() {
    document.getElementById("bigha").value = "";
    document.getElementById("kattha").value = "";
    document.getElementById("dhur").value = "";
    document.getElementById("dhurki").value = "";
    
    // Reset laggi to default 6.5
    let laggiSelect = document.getElementById("laggi");
    for(let i=0; i<laggiSelect.options.length; i++) {
      if(parseFloat(laggiSelect.options[i].value) === 6.5) {
        laggiSelect.selectedIndex = i;
        break;
      }
    }
    
    // Recalculate with reset values (will use 0 for empty fields)
    calculate();
  }

  // Navigation functions from 41.html
  window.handleNavClick = function(event, element) {
    event.preventDefault();
    const href = element.getAttribute('href');
    
    // Remove active class from all nav items
    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.remove('active');
    });
    
    // Add active class to clicked item only
    element.classList.add('active');
    
    // Show which page would open (for demo purposes)
    let pageNames = {
      'nav-home': 'Home Page',
      'nav-area': 'Area Calculator',
      'nav-dismil': 'Dismil to Kattha Converter',
      'nav-unit': 'Unit Converter'
    };
    
    let pageId = element.id;
    alert(`Navigating to: ${pageNames[pageId]}`);
  };

  // Throttled scroll handler for navbar (from 41.html)
  const navContainer = document.getElementById('bottomNavContainer');
  let lastScrollY = window.scrollY;
  let ticking = false;
  let scrollThreshold = 50;

  function updateNavbar() {
    const currentScrollY = window.scrollY;
    
    if (Math.abs(currentScrollY - lastScrollY) < 10) {
      ticking = false;
      return;
    }

    if (currentScrollY > lastScrollY && currentScrollY > scrollThreshold) {
      navContainer.classList.add('hidden');
    } else {
      navContainer.classList.remove('hidden');
    }
    
    lastScrollY = currentScrollY;
    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(updateNavbar);
      ticking = true;
    }
  }, { passive: true });

  // Set active nav item (Home is active for this page)
  function setActiveNav() {
    document.getElementById('nav-home').classList.add('active');
  }

  // Initial calculation and active nav
  window.onload = function() {
    calculate();
    setActiveNav();
  };

  // Add input event listeners to calculate on typing
  document.getElementById('bigha').addEventListener('input', calculate);
  document.getElementById('kattha').addEventListener('input', calculate);
  document.getElementById('dhur').addEventListener('input', calculate);
  document.getElementById('dhurki').addEventListener('input', calculate);
  document.getElementById('laggi').addEventListener('change', calculate);
</script>
  <script src="/components/footer.js"></script>

</body>
</html>
